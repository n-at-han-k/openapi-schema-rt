        configuration must be COMPLETE, transitions included; RT answers 500
        rather than a validation failure to a partial one.
      operationId: lifecycle_name_validate_post
      tags:
        - Lifecycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/lifecycleConfiguration'
      responses:
        "200":
          description: The configuration was checked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
