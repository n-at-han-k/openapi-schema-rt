                        $ref: '#/components/schemas/catalogReference'
                      Status:
                        type: string
                      Owner:
                        # ONE user, not a list -- unlike HeldBy and Contact
                        # below. `GET /asset/3` answers
                        # `"Owner":{"type":"user","id":"Nobody",...}`.
