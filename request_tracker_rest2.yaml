      operationId: customfield_id_rights_right_group_delete
      tags:
        - Rights
      responses:
        "204":
          $ref: '#/components/responses/204'
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
        default:
          description: Unexpected error.
  /customfield/{id}/rights/{right}/user/{principalId}:
    parameters:
      - $ref: '#/components/parameters/id'
      - name: right
        in: path
        required: true
        description: The right to revoke.
        schema:
          type: string
          example: CreateTicket
      - name: principalId
        in: path
        required: true
        description: The ID of the user losing the right. NOT a name --
