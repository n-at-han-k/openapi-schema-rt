        "404":
          $ref: '#/components/responses/404'
        default:
          description: Unexpected error.
    delete:
      description: Disable a customfield. Doesn't actually delete anything.
      operationId: customfield_id_delete
      tags:
        - Custom Field
      responses:
        "204":
          $ref: '#/components/responses/204'
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
        "500":
          $ref: '#/components/responses/doubleDeletion'
        default:
          description: Unexpected error.
  /customfield:
    post:
      description: Create a customfield.
      tags:
        - Custom Field
      operationId: customfield_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/customFieldCommon'
                - type: object
                  description: Fields specific for uploading customfields.
                  properties:
                    MaxValues:
                      type: string
                      description: Whether the field is single valued.
                        Note that not all custom field types support multiple values.
                      # Essentially just a Perl Boolean.
                      enum:
                        # single valued
                        - "1"
                        # multiple valued
                        - "0"
                    Description:
                      type: string
                    EntryHint:
                      type: string
                      example: Fill in one text area
                    UniqueValues:
                      $ref: '#/components/schemas/perlBoolean'
                    Pattern:
                      type: string
                      descrtiption: The validation string
                    SortOrder:
                      $ref: '#/components/schemas/sortOrder'
                    Disabled:
                      $ref: '#/components/schemas/perlBoolean'
                  required:
                    # Not strictly required by the API, but not posting this will assume false, which is almost never what you want.
                    - MaxValues
            example:
              Name: Delivery Date
              Type: Date
              MaxValues: "1"
              LookupType: RT::Queue-RT::Ticket
