    get:
      description: Get information about an article.
      operationId: article_id_get
      tags:
        - Article
      responses:
        "200":
          description: Article queried successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/objectMetadata'
                  - $ref: '#/components/schemas/customFields'
