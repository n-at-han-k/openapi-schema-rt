        "201":
          description: Ticket created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customFieldReference'
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        default:
          description: Unexpected error.
