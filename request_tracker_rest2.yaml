openapi: "3.1.0"
info:
  title: Request Tracker REST2
  description: Partial specification of Request Tracker's REST2 API.
  version: "0.3.3"
  contact:
    name: Iisakki Jaakkola
    email: iihaja@utu.fi
externalDocs:
  url: https://docs.bestpractical.com/rt/latest/RT/REST2.html
  description: Official documentation
servers:
  - url: /REST/2.0
security:
  - token: []
  - basicAuth: []
tags:
  - name: Miscellaneous
  - name: Queue
  - name: Ticket
  - name: User
  - name: User Memberships
  - name: Group
  - name: Group Memberships
  - name: Custom Field
  - name: Custom Role
  - name: Catalog
  - name: Class
  - name: Asset
  - name: Article
  - name: Lifecycle
  - name: Rights
components:
  securitySchemes:
    token:
      type: apiKey
      name: Authorization
      in: header
      description: The apikey has to be prefixed with "token ".
    basicAuth:
      type: http
      scheme: Basic
      description: Prefer token authentication over this.
  requestBodies:
    jsonSearch:
      description: The search terms.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/jsonSearch'
  responses:
    "204":
      description: Success, no content.
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/justMessage'
          example:
            message: Queue name is required
    "401":
      description: Authrotization failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/justMessage'
          example:
            message: Unauthorized
    "403":
      description: No permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/justMessage'
          example:
            message: No permission to create tickets in the queue 'myqueue'
    "404":
      description: The resource wasnt found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/justMessage'
          example:
            message: Not Found
    # It's pretty much impossible to get this if one follows this spec,
    # but anyway it is in the server's repertuare.
    # "415":
    #  description: Unsupported Media Type
    #   content:
    #     application/json:
    #       schema:
    #         $ref: '#/components/schemas/justMessage'
    #       example:
    #         message: Unsupported Media Type
    "doubleDeletion":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/justMessage'
          example:
            message: Internal Server Error
  schemas:
    # Schemas that can be used as such
    justMessage:
      description: Just a message. This is often used in errors.
      type: object
      properties:
        message:
          type: string
      required:
        - message
    objectMetadata:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/id'
        Created:
          type: string
          format: date-time
        Creator:
          $ref: '#/components/schemas/userReference'
        LastUpdated:
          type: string
          format: date-time
        LastUpdatedBy:
          $ref: '#/components/schemas/userReference'
      required:
        - id
        - Created
        - Creator
        - LastUpdated
        - LastUpdatedBy
    customFields:
      type: object
      description: An object with customfields in a response
      properties:
        CustomFields:
          $ref: '#/components/schemas/customFieldsArray'
      required:
        - CustomFields
    customFieldsUpload:
      type: object
      description: An object with customfields in request body
      properties:
        CustomFields:
          description: Structure for uploading custom field values in POSTs and PUTs.
          type: object
          # Basically just a map of custom field key-value pairs.
          additionalProperties:
            anyOf:
              - type:
                  - string
                  - "null"
                description: Single valued custom fields. Use null to remove a value.
              - type: array
                description: Multi-valued custom fields. Use an empty array to clear values.
                items:
                  type: string
          example:
            OperatingSystem: Linux
            SemethingToClear: null
            YourFavoriteNumbers:
              - "1"
              - "6"
              - "pi"
    customFieldCommon:
      description: Fields shared by operations targeted at the customfields themselves
      type: object
      properties:
        Name:
          type: string
        Type:
          type: string
          description: Custom field type.
          # Multiple/single instances are the same.
          # E.g. upload singe and multiple image CF types both show up as "Image" here.
          enum:
            - HTML
            - Freeform
            - Select
            # "Fill in one text area"
            - Text
            - Image
            - Binary # File
            - Combobox
            - Autocomplete
            - Date
            - DateTime
            - IPAddress
            - IPAddressRange
            # Added by the popular BooleanCustomField extension.
            # https://metacpan.org/pod/RT::Extension::BooleanCustomField
            - Boolean
        RenderType:
          type: string
          description: How the custom field is displayed in the UI.
          enum:
            # Most types of CFs don't have any options.
            - ""
            - Select box
            - List
            - Checkbox
        LookupType:
          description: What type of object this custom field applies to?
          type: string
          enum:
            - "" # This seems to be an errorous state in RT but it can nonetheless happen.
            - RT::Catalog-RT::Asset
            - RT::Class
            - RT::Class-RT::Article
            - RT::Group
            - RT::Queue
            - RT::Queue-RT::Ticket
            - RT::Queue-RT::Ticket-RT::Transaction
            - RT::User
        ValidationHint:
          type: string
      required:
        - Name
        - Type
        # RenderType doesn't always appear.
        - LookupType
    paginated:
      description: Response properties for paginated endpoints. items array of the correct type has to be added still.
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        pages:
          type: integer
          minimum: 0
        per_page:
          type: integer
          minimum: 1
        count:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
      required:
        # NOT `pages`: RT leaves it out entirely when the collection is empty.
        # `GET /customfield/2/values` on a field with no values answers
        # {"count":0,"items":[],"page":1,"per_page":20,"total":0}.
        - page
        - per_page
        - count
        - total
    userPropertiesCommon:
      description: Properties shared with multiple user related operations. Does not include required status.
      type: object
      properties:
        RealName:
          type: string
        NickName:
          type: string
        EmailAddress:
          type: string
          anyOf:
            # An email address or an empty string
            - format: email
            - maxLength: 0
        Gecos:
          type: string
          description: '"Unix login" in the UI'
        Lang:
          type: string
          example: fi
        Timezone:
          type: string
          example: Africa/Ceuta
        FreeformContactInfo:
          type: string
          description: '"Extra info" in the UI'
        Comments:
          type: string
          description: Comments about the user.
        WorkPhone:
          type: string
        MobilePhone:
          type: string
        HomePhone:
          type: string
        PagerPhone:
          type: string
        Organization:
          type: string
        Address1:
          type: string
        Address2:
          type: string
        City:
          type: string
        Zip:
          type: string
        State:
          type: string
        Country:
          type: string
    userPassword:
      type: object
      description: Optionanl password property for a user object
      properties:
        Password:
          type: string
          description: Use a strong password!
    ticketPropertiesUploadCommon:
      description: Properties shared with ticket creation and update operations.
      type: object
      properties:
        Subject:
          type: string
          description: Corresponds to the email subject if creating ticket via email
          example: Pls halp
        Owner:
          type: string
          description: Name of the owner
          example: root
        Requestor:
          type: string
          description: Name of the requestor.
            It will not default to the account you are using to make the API call.
          example: root
        Cc:
          type: string
          description: Name of the CC
          example: root
        AdminCc:
          type: string
          description: Name of the adminCC
          example: root
        Starts:
          $ref: '#/components/schemas/maybeDateTime'
        Due:
          $ref: '#/components/schemas/maybeDateTime'
        Priority:
          $ref: '#/components/schemas/ticketPriority'
        Status:
          $ref: '#/components/schemas/ticketStatus'
    ticketPriority:
      type: string
      description: Ticket priority as an integer from 0 (low) to 100 (high)
      example: "50"
    ticketStatus:
      type: string
      description: The values of this field depend on the lifecycle in use.
      example: open
    ticketLinksUpload:
      type: object
      description: Ticket links when creating or updating a ticket.
      properties:
        DependsOn:
          $ref: '#/components/schemas/ticketLink'
        Child:
          $ref: '#/components/schemas/ticketLink'
        ReferredToBy:
          $ref: '#/components/schemas/ticketLink'
        Parent:
          $ref: '#/components/schemas/ticketLink'
        DependedOnBy:
          $ref: '#/components/schemas/ticketLink'
        RefersTo:
          $ref: '#/components/schemas/ticketLink'
      example:
        DependsOn: 1
        Child: 2
        ReferredToBy: 3
        Parent: 4
        DependedOnBy: 5
        RefersTo: 6
    jsonSearch:
      description: Searching with JSON format. Generally used on things other than tickets.
      schema:
        type: array
        items:
          description: One search term
          type: object
          properties:
            field:
              type: string
              examples:
                - Name
                - id
            operator:
              description: The comparison operator to use. Enum may be incomplete.
              type: string
              enum:
                - LIKE
                - "="
                - "<"
                - ">"
            value:
              type: string
            entry_aggregator:
              type: string
              description: How to combine search terms. OR by default.
              enum:
                - OR
                - AND
          required:
            - field
            - value
          additionalProperties: false
    # Incomplete schemas (to be used as building blocks)
    genericObject:
      description: A generic object thats used in many API endpoints. Refer this within suitable schemas.
        Note that there are strictly typed versions of this too.
      type: object
      allOf:
        - $ref: '#/components/schemas/typelessGenericObject'
        - $ref: '#/components/schemas/objectType'
    queueReference:
      description: A reference to a queue.
      type: object
      allOf:
        - $ref: '#/components/schemas/typelessGenericObject'
        - type: object
          description: Always a queue
          properties:
            type:
              type: string
              enum:
                - queue
          required:
            - type
    userReference:
      description: A reference to a user.
      type: object
      allOf:
        - $ref: '#/components/schemas/typelessGenericObject'
        - type: object
          description: Always a user
          properties:
            type:
              type: string
              enum:
                - user
          required:
            - type
    groupReference:
      description: A reference to a group.
      type: object
      allOf:
        - $ref: '#/components/schemas/typelessGenericObject'
        - type: object
          description: Always a group.
          properties:
            type:
              $ref: '#/components/schemas/constantGroup'
          required:
            - type
    ticketReference:
      description: A reference to a ticket
      type: object
      allOf:
        - $ref: '#/components/schemas/typelessGenericObject'
        - type: object
          description: Always a ticket
          properties:
            type:
              $ref: '#/components/schemas/constantTicket'
          required:
            - type
    customFieldReference:
      description: A reference to a custom field
      type: object
      allOf:
        - $ref: '#/components/schemas/typelessGenericObject'
        - type: object
          description: Always a custom field
          properties:
            type:
              $ref: '#/components/schemas/constantCustomField'
          required:
            - type
    typelessGenericObject:
      description: A generic object with type field missing. Add it in other templates.
      type: object
      properties:
        _url:
          type: string
          format: uri
          description: URL of the objects api endpoint.
        id:
          type: string
          description: This sounds like an int but actually its quite often a string.
          examples:
            - RT_System
            - root
      required:
        - id
        - _url
    # "_hyperlink" related polymorphic objects
    hyperlink:
      description: Parent object for _hyperlink objects
      type: object
      properties:
        ref:
          type: string
          description: Discriminates between hyperlink object types
        _url:
          description: The URL for evoking the offered operation.
          allOf:
            - $ref: '#/components/schemas/url'
      required:
        - ref
        - _url
      discriminator:
        propertyName: ref
        mapping:
          # All derivations should be declared here.
          comment: '#/components/schemas/hyperlinkComment'
          correspond: '#/components/schemas/hyperlinkCorrespond'
          create: '#/components/schemas/hyperlinkCreate'
          customfield: '#/components/schemas/hyperlinkCustomField'
          customfieldvalues: '#/components/schemas/hyperlinkCustomFieldValues'
          history: '#/components/schemas/hyperlinkHistory'
          rights: '#/components/schemas/hyperlinkRights'
          rights-available: '#/components/schemas/hyperlinkRights'
          lifecycle: '#/components/schemas/hyperlinkLifecycle'
          members: '#/components/schemas/hyperlinkMembers'
          memberships: '#/components/schemas/hyperlinkMemberships'
          self: '#/components/schemas/hyperlinkSelf'
          # Ticket links are all of the same type
          depends-on: '#/components/schemas/hyperlinkTicketLink'
          child: '#/components/schemas/hyperlinkTicketLink'
          referred-to-by: '#/components/schemas/hyperlinkTicketLink'
          parent: '#/components/schemas/hyperlinkTicketLink'
          depended-on-by: '#/components/schemas/hyperlinkTicketLink'
          refers-to: '#/components/schemas/hyperlinkTicketLink'
    hyperlinkComment:
      description: Link for commenting, somehow.
      allOf:
        - $ref: '#/components/schemas/hyperlink'
    hyperlinkCorrespond:
      description: Link for corresponding, somehow.
      allOf:
        - $ref: '#/components/schemas/hyperlink'
    hyperlinkCreate:
      description: Operation to create a ticket
      allOf:
        - $ref: '#/components/schemas/hyperlink'
        - type: object
          properties:
            type:
              $ref: '#/components/schemas/constantTicket'
          required:
            - type
    hyperlinkCustomField:
      description: Reference to a custom field, as in the object itself, and not any particular value.
      allOf:
        - $ref: '#/components/schemas/hyperlink'
        - type: object
          properties:
            id:
              type: string
              example: "3"
            name:
              type: string
            type:
              $ref: '#/components/schemas/constantCustomField'
          required:
            - id
            - type
            - name
    hyperlinkCustomFieldValues:
      description: Reference to available customfield values of select type CFs.
      allOf:
        - $ref: '#/components/schemas/hyperlink'
    hyperlinkRights:
      description: Link to an object's rights, or to the rights that can be
        granted on it. Carries no id of its own.
      allOf:
        - $ref: '#/components/schemas/hyperlink'
    hyperlinkHistory:
      description: Link to element history
      allOf:
        - $ref: '#/components/schemas/hyperlink'
    hyperlinkLifecycle:
      description: A possible transition in the objects state.
      allOf:
        - $ref: '#/components/schemas/hyperlink'
        - type: object
          properties:
            from:
              type: string
              example: open
              description: Current lifecycle status
            to:
              type: string
              description: Target status of this transition
              example: resolved
            update:
              type: string
              description: Apparently this means the way that the transition would be carried out?
              examples:
                - Comment
                - Respond
            label:
              type: string
              description: Seems to be more of a human readable name for the transaction thats being described.
              examples:
                - Resolve
                - Reject
                - Stall
          required:
            - from
            - to
            - update
            - label
    hyperlinkMembers:
      description: Show group members.
      allOf:
        - $ref: '#/components/schemas/hyperlink'
    hyperlinkMemberships:
      description: Show groups whose member this user/group is.
      allOf:
        - $ref: '#/components/schemas/hyperlink'
    hyperlinkSelf:
      description: Link to self. Type will vary depending on where you got this from.
      allOf:
        - $ref: '#/components/schemas/hyperlink'
        - type: object
          properties:
            id:
              # An INTEGER, unquoted -- and the one place in _hyperlinks that
              # is. A ticket's own array carries `{"ref":"self","id":1}` beside
              # `{"ref":"customfield","id":"2"}`, so the two branches really do
              # disagree and a client that flattens them needs a type that
              # holds both.
              type: integer
              example: 3
            type:
              $ref: '#/components/schemas/typeEnum'
          required:
            - id
            - type
    hyperlinkTicketLink:
      description: A link to another ticket
      allOf:
        - $ref: '#/components/schemas/hyperlink'
        - type: object
          properties:
            id:
              type: string
              example: "3"
            type:
              $ref: '#/components/schemas/constantTicket'
          required:
            - id
            - type
    # Fields
    customFieldApplication:
      description: One place a custom field applies. ObjectId 0 with Global
        true is the global application; anything else names the object.
      type: object
      properties:
        ObjectId:
          type: integer
          minimum: 0
        Global:
          type: boolean
        ObjectType:
          type: string
          example: RT::Queue
        ObjectName:
          type: string
        _url:
          $ref: '#/components/schemas/url'
      required:
        - ObjectId
    customFieldsApplied:
      type: array
      description: The custom fields applied to an object, as a queue lists the
        ones its tickets have. No values -- these are the fields themselves.
      items:
        type: object
        properties:
          id:
            # Quoted here, unlike the unquoted one a queue gives for itself.
            anyOf:
              - type: integer
              - type: string
          name:
            type: string
          ref:
            type: string
            enum:
              - customfield
          type:
            $ref: '#/components/schemas/constantCustomField'
          _url:
            $ref: '#/components/schemas/url'
        required:
          - id
          - name
          - _url
    customFieldsArray:
      type: array
      description: Customfields with their values, as returned by the server.
      items:
        type: object
        properties:
          id:
            type: string
            example: "6"
          name:
            type: string
            description: Key
          values:
            type: array
            description: TODO
          _url:
            $ref: '#/components/schemas/url'
          type:
            type: string
            enum:
              - customfield
        required:
          - id
          - name
          - values
          - _url
          - type
        additionalProperties: false
    id:
      description: Integer identifier
      type: integer
      minimum: 1
    objectType:
      description: Object containing type field.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/typeEnum'
      required:
        - type
    typeEnum:
      description: Enum used in many type named fields.
      type: string
      enum:
        # Likely not complete
        - queue
        - ticket
        - user
    maybeDateTime:
      descrtiption: A date-time string which may be undefined. Which RT expresses as unix timestamp zero.
        I.e. the start of 1970. So you probably want to compare these values to it.
        It appears like only UTC times are supported.
        So returned times are always in UTC and uploading times with a timezone component other than Z will fail silently.
      type: string
      format: date-time
      example: 1970-01-01T00:00:00Z
    perlBooleanInteger:
      description: Same as perlBoolean but in the slightly more sensible integer format.
      type: integer
      enum:
        # true
        - 1
        # false
        - 0
    perlBoolean:
      description: RT doesn't bother to translate perl boolean value to JSON.
      type: string
      enum:
        # true
        - "1"
        # false
        - "0"
    sortOrder:
      type: string
      description: Seems to be an enumeration of some kind.
      example: "0"
    url:
      description: An URL pointing somewhere in the web
      type: string
      format: uri
      example: "https://localhost/REST/2.0/customfield/6"
    ticketLink:
      # A link to another ticket when uploading.
      anyOf:
        - type: integer
          description: ID of a ticket
          example: 1
        - type: array
          description: IDs of tickets
          items:
            type: integer
          example:
            - 10
            - 15
        - type: string
          description: A freeform string. E.g. this could be a URL to another system.
    # Constants
    constantCustomField:
      description: Always customfield
      type: string
      enum:
        - customfield
    constantGroup:
      description: Always group
      type: string
      enum:
        - group
    constantTicket:
      description: Always ticket
      type: string
      enum:
        - ticket
    # Reverse engineered from the endpoints documented at
    # https://docs.bestpractical.com/rt/latest/RT/REST2.html and the Create()
    # arguments each class documents. Added for the objects the spec did not
    # cover: catalogs, classes, assets, articles, custom roles, custom field
    # values, lifecycles and rights.
    catalogReference:
      description: A reference to a catalog.
      type: object
      allOf:
        - $ref: '#/components/schemas/typelessGenericObject'
        - type: object
          description: Always a catalog
          properties:
            type:
              type: string
              enum:
                - catalog
          required:
            - type
    classReference:
      description: A reference to a class.
      type: object
      allOf:
        - $ref: '#/components/schemas/typelessGenericObject'
        - type: object
          description: Always a class
          properties:
            type:
              type: string
              enum:
                - class
          required:
            - type
    assetReference:
      description: A reference to an asset.
      type: object
      allOf:
        - $ref: '#/components/schemas/typelessGenericObject'
        - type: object
          description: Always an asset
          properties:
            type:
              type: string
              enum:
                - asset
          required:
            - type
    articleReference:
      description: A reference to an article.
      type: object
      allOf:
        - $ref: '#/components/schemas/typelessGenericObject'
        - type: object
          description: Always an article
          properties:
            type:
              type: string
              enum:
                - article
          required:
            - type
    lifecycleReference:
      description: A reference to a lifecycle. Lifecycles are addressed by name.
      type: object
      allOf:
        - $ref: '#/components/schemas/typelessGenericObject'
        - type: object
          description: Always a lifecycle
          properties:
            type:
              type: string
              enum:
                - lifecycle
          required:
            - type
    catalogPropertiesCommon:
      description: Properties of a catalog, which is to assets what a queue is to tickets.
      type: object
      properties:
        Name:
          type: string
          maxLength: 255
        Description:
          type: string
          maxLength: 255
        Lifecycle:
          type: string
          description: Name of the lifecycle governing this catalog's assets.
          example: assets
        Disabled:
          $ref: '#/components/schemas/perlBoolean'
    classPropertiesCommon:
      description: Properties of an article class.
      type: object
      properties:
        Name:
          type: string
          maxLength: 255
        Description:
          type: string
          maxLength: 255
        SortOrder:
          $ref: '#/components/schemas/sortOrder'
        Disabled:
          $ref: '#/components/schemas/perlBoolean'
    assetPropertiesCommon:
      description: Properties of an asset. The role fields take principal ids.
      type: object
      properties:
        Name:
          type: string
          maxLength: 255
        Description:
          type: string
          maxLength: 255
        Catalog:
          type: string
          description: Name or numeric id of the catalog the asset belongs to.
          example: General assets
        Status:
          type: string
          description: A status from the catalog's lifecycle.
          example: in-use
        Owner:
          type: string
          description: Principal id or name of the owner.
        HeldBy:
          type: array
          description: Principal ids or names holding the asset.
          items:
            type: string
        Contact:
          type: array
          description: Principal ids or names to contact about the asset.
          items:
            type: string
    articlePropertiesCommon:
      description: Properties of an article.
      type: object
      properties:
        Name:
          type: string
          maxLength: 255
        Summary:
          type: string
          maxLength: 255
        Class:
          type: string
          description: Name or numeric id of the class the article belongs to.
        SortOrder:
          $ref: '#/components/schemas/sortOrder'
        Parent:
          type: integer
          description: Id of the parent article, if any.
          minimum: 0
        URI:
          type: string
          maxLength: 255
        Disabled:
          $ref: '#/components/schemas/perlBoolean'
    customRolePropertiesCommon:
      description: Properties of a custom role, which is a ticket role beyond
        Owner, Requestor, Cc and AdminCc.
      type: object
      properties:
        Name:
          type: string
          maxLength: 200
        Description:
          type: string
          maxLength: 255
        MaxValues:
          type: string
          description: Whether the role takes a single principal.
          enum:
            # single valued
            - "1"
            # multiple valued
            - "0"
        EntryHint:
          type: string
          maxLength: 255
        LookupType:
          type: string
          description: What type of object this role applies to.
          example: RT::Queue-RT::Ticket
        Disabled:
          $ref: '#/components/schemas/perlBoolean'
    customFieldValuePropertiesCommon:
      description: One of the values a Select or Combobox custom field offers.
      type: object
      properties:
        Name:
          type: string
        Description:
          type: string
        SortOrder:
          $ref: '#/components/schemas/sortOrder'
        Category:
          type: string
          description: Groups values under a heading, for a field based on another.
    lifecycleConfiguration:
      description: A lifecycle's whole configuration. RT spells these keys in
        lower case, unlike every other object in this API.
      type: object
      properties:
        type:
          type: string
          enum:
            - ticket
            - asset
        initial:
          description: Statuses a new object may start in.
          type: array
          items:
            type: string
        active:
          description: Statuses meaning work is ongoing.
          type: array
          items:
            type: string
        inactive:
          description: Statuses meaning work has stopped.
          type: array
          items:
            type: string
        defaults:
          description: Which status an action moves an object to.
          type: object
          additionalProperties:
            type: string
          example:
            on_create: new
            on_resolve: resolved
        transitions:
          description: Which statuses each status may move to. The empty key is
            the transition into the lifecycle.
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        rights:
          description: The right required to make a transition.
          type: object
          additionalProperties:
            type: string
        actions:
          # A FLAT array that alternates: the string "new -> open", then the
          # object configuring it, then the next string. Not a list of
          # objects, which is what it looks like from the UI.
          description: The transitions offered in the UI, as alternating
            "from -> to" strings and their configuration.
          type: array
          items:
            anyOf:
              - type: string
              - type: object
        colors:
          description: A colour per status, as shown in the UI.
          type: object
          additionalProperties:
            type: string
    lifecycleDocument:
      description: A lifecycle as RT hands it back -- its whole configuration,
        plus the name it is addressed by. A lifecycle has no id at all, and
        the `type` here is the kind of object it governs rather than the kind
        of thing it is.
      allOf:
        - $ref: '#/components/schemas/lifecycleConfiguration'
        - type: object
          properties:
            name:
              type: string
            canonical_case:
              description: The capitalisation RT treats as canonical for each
                status, keyed by the lower-case form.
              type: object
              additionalProperties:
                type: string
            _url:
              $ref: '#/components/schemas/url'
    lifecycleMaps:
      description: How statuses translate when an object moves between two
        lifecycles. Keyed "<from> -> <to>".
      type: object
      additionalProperties:
        type: object
        additionalProperties:
          type: string
    rightGrant:
      description: One right, granted to one principal. Exactly one of Group and
        User is given.
      type: object
      properties:
        Right:
          type: string
          example: CreateTicket
        Group:
          type: string
          description: Name or id of the group receiving the right.
          example: Staff
        User:
          type: string
          description: Name or id of the user receiving the right.
      required:
        - Right
    rightsBulk:
      description: Rights to grant and to revoke in one request.
      type: object
      properties:
        grant:
          type: array
          items:
            $ref: '#/components/schemas/rightGrant'
        revoke:
          type: array
          items:
            $ref: '#/components/schemas/rightGrant'
    principalReference:
      description: A principal as a RIGHTS listing spells it, which is not how
        the rest of the API spells one. `GET /global/rights` answers
        `{"id":6,"_url":"..."}` -- the id unquoted, and no `type` at all.
      type: object
      properties:
        id:
          anyOf:
            - type: integer
            - type: string
        Name:
          type: string
        _url:
          $ref: '#/components/schemas/url'
      required:
        - id
        - _url
    rightsList:
      description: The rights granted on an object, one entry per principal.
      type: object
      allOf:
        - $ref: '#/components/schemas/paginated'
        - type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  Right:
                    type: string
                  Group:
                    $ref: '#/components/schemas/principalReference'
                  User:
                    $ref: '#/components/schemas/principalReference'
  parameters:
    id:
      name: id
      in: path
      required: true
      description: The id of the object we are interested in
      schema:
        type: integer
        minimum: 1
    idOrName:
      name: idOrName
      in: path
      required: true
      description: Name or id of the resource.
      schema:
        oneOf:
          - type: integer
            minimum: 1
            description: Id of the resource
          - type: string
            description: Name of the resource
    name:
      name: name
      in: path
      required: true
      description: Name of the resource. Lifecycles are addressed by name, not by id.
      schema:
        type: string
        example: support
    query:
      name: query
      in: query
      description: RT query string (or a simple search string in some cases)
      schema:
        type: string
      allowReserved: true
  links:
    creator:
      description: Who created this thing in my RT?!
      operationId: user_id_name_get
      parameters:
        idOrName: $response.body#/Creator/id
    lastUpdatedBy:
      description: Who ruined it this time..?
      operationId: user_id_name_get
      parameters:
        idOrName: $response.body#/LastUpdatedBy/id
paths:
  /rt:
    get:
      description: Produces system information.
      operationId: rt_get
      tags:
        - Miscellaneous
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  Version:
                    type: string
                  Plugins:
                    type: array
                    description: This list will only be present if the user has SuperUser privileges in RT.
                    items:
                      description: Perl module names.
                      type: string
                      example: 'RT::Extension::GroupSummary'
                required:
                  - Version
                example:
                  Version: "5.0.3"
                  Plugins:
                    - "RT::Extension::Announce"
                    - "RT::Extension::GroupSummary"
        "401":
          $ref: '#/components/responses/401'
        default:
          description: Unexpected error.
  /users:
    # There's also a get version of this, but it takes arguments in query so it's a mess.
    # JSON content version is much nicer.
    post:
      operationId: users_get
      description: Search for users
      tags:
        - User
      requestBody:
        description: Search terms
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/jsonSearch'
            examples:
              usersByName:
                description: Searching for a user by name
                value:
                  - field: Name
                    value: userid
                    operator: LIKE
      responses:
        "200":
          description: Search successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/paginated'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/userReference'
        "401":
          $ref: '#/components/responses/401'
        default:
          description: Unexpected error.
  /user:
    post:
      description: Create a new user.
      operationId: user_post
      tags:
        - User
      requestBody:
        description: Details for the upcoming user.
          Note that users are created unprivileged by default.
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/customFieldsUpload'
                - $ref: '#/components/schemas/userPropertiesCommon'
                - $ref: '#/components/schemas/userPassword'
                - type: object
                  description: Properties not in userPropertiesCommon.
                  properties:
                    Name:
                      type: string
                    Disabled:
                      $ref: '#/components/schemas/perlBoolean'
                    Privileged:
                      description: Can this user be granted rights in RT?
                      allOf:
                        - $ref: '#/components/schemas/perlBooleanInteger'
                  required:
                    - Name
            example:
              Name: NewUser
              Privileged: 1
              Password: Color Out of Space is an intriguing story by Lovecraft.
      responses:
        "201":
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userReference'
          links:
            disable:
              description: Oops a mistake, let's disable the new user!
              operationId: user_id_name_delete
              parameters:
                idOrName: $response.body#/id
            get:
              description: Remind me of what I just entered, will you?
              operationId: user_id_name_get
              parameters:
                idOrName: $response.body#/id
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/justMessage'
              examples:
                nameTake:
                  description: Account with this name already exists.
                  value:
                    message: "Name in use"
        "401":
          $ref: '#/components/responses/401'
        default:
          description: Unexpected error.
  /user/{idOrName}:
    parameters:
      - $ref: '#/components/parameters/idOrName'
    get:
      description: Get information about a user.
      operationId: user_id_name_get
      tags:
        - User
      responses:
        "200":
          description: Successfully fetched user info.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/customFields'
                  - $ref: '#/components/schemas/objectMetadata'
                  - $ref: '#/components/schemas/userPropertiesCommon'
                  - type: object
                    description: Requirements not in userPropertiesCommon. System accounts will have quite a bit less fields.
                    properties:
                      Name:
                        type: string
                      Disabled:
                        $ref: '#/components/schemas/perlBoolean'
                      Privileged:
                        description: Can this user be granted rights in RT?
                        allOf:
                          - $ref: '#/components/schemas/perlBooleanInteger'
                    required:
                      - Name
                      - Disabled
                      - Privileged
                  - type: object
                    properties:
                      Memberships:
                        type: array
                        items:
                          $ref: '#/components/schemas/groupReference'
                      _hyperlinks:
                        type: array
                        items:
                          anyOf:
                            - $ref: '#/components/schemas/hyperlinkSelf'
                            - $ref: '#/components/schemas/hyperlinkHistory'
                            - $ref: '#/components/schemas/hyperlinkMemberships'
                        example:
                          - id: 41
                            ref: self
                            _url: https://localhost/REST/2.0/user/41
                            type: user

                          - _url: https://localhost/REST/2.0/user/41/history
                            ref: history

                          - ref: memberships
                            _url: https://localhost/REST/2.0/user/41/groups
                    required:
                      - Memberships
                      - _hyperlinks
          links:
            disable:
              description: Disable the user.
              operationId: user_id_name_delete
              parameters:
                idOrName: $request.path.idOrName
            creator:
              $ref: '#/components/links/creator'
            lastUpdatedBy:
              $ref: '#/components/links/lastUpdatedBy'
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
        default:
          description: Unexpected error.
    put:
      description: Update a user. Password cannot be changed.
      operationId: user_id_name_put
      tags:
        - User
      requestBody:
        description: The canges to be made to the user
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/customFieldsUpload'
                - $ref: '#/components/schemas/userPropertiesCommon'
                - type: object
                  description: Properties not in userPropertiesCommon
                  # Shouldn't be empty.
                  minProperties: 1
                  properties:
                    Name:
                      type: string
                    Disabled:
                      $ref: '#/components/schemas/perlBoolean'
                    Privileged:
                      description: Can this user be granted rights in RT?
                      allOf:
                        - $ref: '#/components/schemas/perlBooleanInteger'
      responses:
        "200":
          description: This is returned pretty much always. You need to inspect the content to figure out what happened.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                success:
                  description: Trying to set two properties to user TargetUser, but lacking privileges.
                  value:
                    - "User TargetUser: City changed from (no value) to 'Turku'"
                    - "User TargetUser: NickName changed from (no value) to 'Nick'"
                successfullyMadePrivileged:
                  description: Response for just making a user privileged.
                  value:
                    - "That user is now privileged"
                permissionDenied:
                  description: Trying to set two properties to user TargetUser, but lacking privileges.
                  value:
                    - "User TargetUser: Permission Denied"
                    - "User TargetUser: Permission Denied"
                nothingDone:
                  description: Providing nonsense keys will just result in a nop.
                    Though it shouldnt be possile if you stick to this spec.
                  value: []
        "404":
          $ref: '#/components/responses/404'
        default:
          description: Unexpected error.
    delete:
      description: Disable a user. Doesn't actually delete anything.
      operationId: user_id_name_delete
      tags:
        - User
      responses:
        "204":
          $ref: '#/components/responses/204'
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
        "500":
          # This is thrown if you try to delete an already deleted user.
          $ref: '#/components/responses/doubleDeletion'
        default:
          description: Unexpected error.
  /user/{idOrName}/groups:
    parameters:
      - $ref: '#/components/parameters/idOrName'
    put:
      description: Add user to groups.
      operationId: user_name_groups_put
      tags:
        - User Memberships
      requestBody:
        description: The groups where this user is to be added
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
                description: Group ID
                minimum: 1
                example: 40
              minItems: 1
      responses:
        "200":
          description: This is returned pretty much no matter what.
            You need to inspect the content to find out what happened.
          content:
            application/json:
              schema:
                type: array
                description: The returned array has double the length as the sent input array.
                  Essentially it contains a two part response for each input id.
                items:
                  description: Alternating between perlbooleanInteger and a string message,
                    starting witht a perlbooleanInteger. The boolean will tell whether the addiotion to
                    a particular group was a success.
                  anyOf:
                    - $ref: '#/components/schemas/perlBooleanInteger'
                    - type: string
              examples:
                groupWasntFound:
                  description: Response to one invalid group id and nothting else.
                  value:
                    - 0
                    - Group not found
                alreadyAMember:
                  description: Tried to add the user to one group which she was already a member of.
                  value:
                    - 0
                    - 'Group already has member: root'
                success:
                  description: Root added to two groups
                  value:
                    - 1
                    - "Member added: root"
                    - 1
                    - "Member added: root"
        "401":
          $ref: '#/components/responses/401'
        default:
          description: Unexpected error.
    delete:
      description: Remove a user from every group they are a member of.
      operationId: user_name_groups_delete
      tags:
        - User Memberships
      responses:
        "204":
          $ref: '#/components/responses/204'
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
        "500":
          $ref: '#/components/responses/doubleDeletion'
        default:
          description: Unexpected error.
  /groups:
    parameters:
      - $ref: '#/components/parameters/query'
    post:
      description: Search for groups.
      operationId: groups_post
      tags:
        - Group
      requestBody:
        $ref: '#/components/requestBodies/jsonSearch'
      responses:
        "200":
          description: No errors
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/paginated'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/groupReference'
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        default:
          description: Unexpected error.
  /group:
    post:
      description: Create a group.
      operationId: group_post
      tags:
        - Group
      requestBody:
        description: Specifications for the new group.
        required: true
        content:
          application/json:
            schema:
              type: object
              description: These are just the properties which can be set from the UI. Dont know about others.
              additionalProperties: false
              properties:
                Name:
                  type: string
                Description:
                  type: string
                Disabled:
                  $ref: '#/components/schemas/perlBoolean'
              required:
                - Name
      responses:
        "201":
          description: Group created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/groupReference'
              example:
                id: "44"
                _url: "https://localhost/REST/2.0/group/44"
                type: group
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        default:
          description: Unexpected error.
  /group/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      description: Get info about a group.
      operationId: group_id_get
      tags:
        - Group
      responses:
        "200":
          description: Group info fetched successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/objectMetadata'
                  - $ref: '#/components/schemas/customFields'
                  - type: object
                    properties:
                      Name:
                        type: string
                      Description:
                        type: string
                      _hyperlinks:
                        type: array
                        description: Things and operations related to this queue.
                        items:
                          anyOf:
                            - $ref: '#/components/schemas/hyperlinkMembers'
                            - $ref: '#/components/schemas/hyperlinkHistory'
                            - $ref: '#/components/schemas/hyperlinkSelf'
                      Domain:
                        type: string
                        description: Enum likely incomplete.
                        enum:
                          - UserDefined
                      Instance:
                        type: string
                        description: No idea what this means.
                        example: "0"
                      Disabled:
                        $ref: '#/components/schemas/perlBoolean'
                      Members:
                        description: Member users and groups
                        type: array
                        items:
                          anyOf:
                            - $ref: '#/components/schemas/userReference'
                            - $ref: '#/components/schemas/groupReference'
                          # discriminator could be added here but I suppose it's fine without it too.
                    required:
                      - Name
                      - _hyperlinks
                      - Domain
                      - Description
                      - Instance
                      - Disabled
                      - Members
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
        default:
          description: Unexpected error.
    put:
      description: Update a group.
      operationId: group_id_put
      tags:
        - Group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                Name:
                  type: string
                Description:
                  type: string
                Disabled:
                  $ref: '#/components/schemas/perlBoolean'
      responses:
        "200":
          description: This is returned pretty much always. You need to inspect
            the content to figure out what happened.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "400":
          $ref: '#/components/responses/400'
        "404":
          $ref: '#/components/responses/404'
        default:
          description: Unexpected error.
    delete:
      description: Disable a group. Doesn't actually delete anything.
      operationId: group_id_delete
      tags:
        - Group
      responses:
        "204":
          $ref: '#/components/responses/204'
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
        "500":
          $ref: '#/components/responses/doubleDeletion'
        default:
          description: Unexpected error.
  /group/{id}/members:
    parameters:
      - $ref: '#/components/parameters/id'
    put:
      description: Add users and groups to a group.
      operationId: group_id_members_put
      tags:
        - Group Memberships
      requestBody:
        description: The users and groups to be added to the group
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
                description: So called principal ID of a user to be added.
                  For normal users this seems to be just the user ID,
                  but for special users like root it could be anything.
                minimum: 1
                example: 14
              minItems: 1
      responses:
        "200":
          description: This is returned pretty much no matter what.
            You need to inspect the content to find out what happened.
          content:
            application/json:
              schema:
                type: array
                description: The returned array has the same length as the sent input array.
                  Essentially it contains an individual response to each input id.
                items:
                  type: string
              examples:
                idWasntFound:
                  description: Response to one invalid id and nothting else.
                  value:
                    - You should provide principal id for each member to add
                alreadyAMember:
                  description: Response to one user id which is already a member of the group.
                  value:
                    - 'Group already has member: root'
                success:
                  description: Two users and one group added successfully to the group.
                  value:
                    - "Member added: root"
                    - "Member added: another user"
                    - "Member added: group name"
                selfAddition:
                  description: Tried to add the group itself as its member.
                  value:
                    - "Groups can't be members of their members"
        "401":
          $ref: '#/components/responses/401'
        default:
          description: Unexpected error.
    delete:
      description: Remove every member from a group.
      operationId: group_id_members_delete
      tags:
        - Group Memberships
      responses:
        "204":
          $ref: '#/components/responses/204'
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
        "500":
          $ref: '#/components/responses/doubleDeletion'
        default:
          description: Unexpected error.
  /queues/all:
    get:
      description: Retrieve list of all queues you can see.
      operationId: queues_all_get
      tags:
        - Queue
      responses:
        "200":
          description: Queue queried successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/paginated'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/queueReference'
        "401":
          $ref: '#/components/responses/401'
        default:
          description: Unexpected error.
  /queue:
    post:
      description: Create a new queue.
      operationId: queue_post
      tags:
        - Queue
      requestBody:
        description: Specifications for the new queue.
        required: true
        content:
          application/json:
            schema:
              type: object
              description: These are the properties shown in the UI. Others could be accepted here as well.
              additionalProperties: false
              properties:
                Name:
                  type: string
                  description: Using an existing queue name will result in 400.
                Description:
                  type: string
                Lifecycle:
                  type: string
                SubjectTag:
                  type: string
                SortOrder:
                  $ref: '#/components/schemas/sortOrder'
                CorrespondAddress:
                  type: string
                  description: Reply Address in the UI
                CommentAddress:
                  type: string
                SLADisabled:
                  $ref: '#/components/schemas/perlBoolean'
                Disabled:
                  $ref: '#/components/schemas/perlBoolean'
              required:
                - Name
      responses:
        "201":
          description: Queue created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/queueReference'
              example:
                id: "4"
                _url: "https://localhost/REST/2.0/queue/4"
                type: queue
          links:
            disable:
              description: Ohh I didn't mean to do that. Let's disable the newly created queue...
              operationId: queue_id_name_delete
              parameters:
                idOrName: $response.body#/id
            get:
              description: Get the info you just entered yourself
              operationId: queue_id_name_get
              parameters:
                idOrName: $response.body#/id
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        default:
          description: Unexpected error.
  /queue/{idOrName}:
    parameters:
      - $ref: '#/components/parameters/idOrName'
    get:
      description: Get information about a queue.
      operationId: queue_id_name_get
      tags:
        - Queue
      responses:
        "200":
          description: Queue queried successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/objectMetadata'
                  - $ref: '#/components/schemas/customFields'
                  - type: object
                    properties:
                      SLADisabled:
                        $ref: '#/components/schemas/perlBoolean'
                      Cc:
                        type: array
                        items:
                          $ref: '#/components/schemas/userReference'
                      AdminCc:
                        type: array
                        items:
                          $ref: '#/components/schemas/userReference'
                      SortOrder:
                        $ref: '#/components/schemas/sortOrder'
                      Name:
                        type: string
                      Description:
                        type: string
                      TicketCustomFields:
                        # The FIELDS, not their values: each entry carries
                        # `ref: customfield` and no `values`, which is the
                        # other way round from customFieldsArray.
                        $ref: '#/components/schemas/customFieldsApplied'
                      CommentAddress:
                        type: string
                        description: May be empty.
                      Disabled:
                        $ref: '#/components/schemas/perlBoolean'
                      Lifecycle:
                        type: string
                      _hyperlinks:
                        type: array
                        description: Things and operations related to this queue.
                        items:
                          anyOf:
                            - $ref: '#/components/schemas/hyperlinkCreate'
                            - $ref: '#/components/schemas/hyperlinkHistory'
                            - $ref: '#/components/schemas/hyperlinkSelf'
                      CorrespondAddress:
                        type: string
                        description: Reply Address in the UI
                        example: ""
                      TicketTransactionCustomFields:
                        type: array
                        description: TODO
                      SubjectTag:
                        type: string
                    required:
                      - SLADisabled
                      - Cc
                      - SortOrder
                      - Name
                      - Description
                      - TicketCustomFields
                      - CommentAddress
                      - Disabled
                      - AdminCc
                      - Lifecycle
                      - _hyperlinks
                      - CorrespondAddress
                      - TicketTransactionCustomFields
          links:
            disable:
              description: This queue doesn't look right. Let's disable it.
              operationId: queue_id_name_delete
              parameters:
                idOrName: $request.path.idOrName
            creator:
              $ref: '#/components/links/creator'
            lastUpdatedBy:
              $ref: '#/components/links/lastUpdatedBy'
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
        default:
          description: Unexpected error.
    delete:
      description: Disable a queue.
      operationId: queue_id_name_delete
      tags:
        - Queue
      responses:
        "204":
          $ref: '#/components/responses/204'
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
        "500":
          # This is thrown if you try to delete an already deleted queue.
          # I reported this. Let's see if they fix it.
          $ref: '#/components/responses/doubleDeletion'
        default:
          description: Unexpected error.
    put:
      description: Update a queue.
      operationId: queue_id_name_put
      tags:
        - Queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: These are the properties shown in the UI. Others could be accepted here as well.
              additionalProperties: false
              properties:
                Name:
                  type: string
                Description:
                  type: string
                Lifecycle:
                  type: string
                SubjectTag:
                  type: string
                SortOrder:
                  $ref: '#/components/schemas/sortOrder'
                CorrespondAddress:
                  type: string
                  description: Reply Address in the UI
                CommentAddress:
                  type: string
                SLADisabled:
                  $ref: '#/components/schemas/perlBoolean'
                Disabled:
                  $ref: '#/components/schemas/perlBoolean'
      responses:
        "200":
          description: This is returned pretty much always. You need to inspect
            the content to figure out what happened.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "400":
          $ref: '#/components/responses/400'
        "404":
          $ref: '#/components/responses/404'
        default:
          description: Unexpected error.
