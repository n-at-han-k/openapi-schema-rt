  /queue/{idOrName}/rights:
    parameters:
      - $ref: '#/components/parameters/idOrName'
    get:
      description: List the rights granted on this queue, one entry per
        principal and right.
      operationId: queue_id_name_rights_get
      tags:
        - Rights
      responses:
        "200":
          description: Rights queried successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rightsList'
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
        default:
          description: Unexpected error.
    post:
      description: Grant one right on this queue to one principal.
      operationId: queue_id_name_rights_post
      tags:
        - Rights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/rightGrant'
      responses:
        "201":
          description: Right granted successfully.
          content:
            application/json:
              schema:
                # The grant itself, not a list of messages: RT answers
                # {"Right":"SeeQueue","Group":{"id":257,...}}.
                allOf:
                  - type: object
                    properties:
                      Right:
                        type: string
                      Group:
                        $ref: '#/components/schemas/principalReference'
                      User:
                        $ref: '#/components/schemas/principalReference'
          links:
            # How a grant is TAKEN BACK. Spelled out because the revoke path
            # is not this one with an id on the end -- it carries the right
            # and the principal -- so nothing can derive it from the grant.
            # Which of the two applies is whichever of Group and User the
            # grant named.
            revokeFromGroup:
              description: Take this right back from the group it was granted to.
              operationId: queue_id_name_rights_right_group_delete
              parameters:
                idOrName: $request.path.idOrName
                right: $request.body#/Right
                principalId: $request.body#/Group
            revokeFromUser:
              description: Take this right back from the user it was granted to.
              operationId: queue_id_name_rights_right_user_delete
              parameters:
                idOrName: $request.path.idOrName
                right: $request.body#/Right
                principalId: $request.body#/User
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
        default:
          description: Unexpected error.
  /queue/{idOrName}/rights/available:
    parameters:
      - $ref: '#/components/parameters/idOrName'
    get:
      description: The rights that CAN be granted on this queue, which is
        what makes a grant's Right field checkable before it is sent.
      operationId: queue_id_name_rights_available_get
      tags:
        - Rights
      responses:
        "200":
          description: Available rights queried successfully.
          content:
            application/json:
              schema:
                # category -> { right name: what it lets you do }. RT answers
                # a MAP of descriptions here, e.g.
                # {"General":{"CreateTicket":"Create tickets"}}, not a list of
                # right names.
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: string
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
        default:
