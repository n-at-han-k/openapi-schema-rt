      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/lifecycleMaps'
      responses:
        "200":
          description: Maps updated.
          content:
            application/json:
              schema:
                # The maps as they now stand -- `{}` when there are none.
                $ref: '#/components/schemas/lifecycleMaps'
        "400":
          $ref: '#/components/responses/400'
        "404":
          $ref: '#/components/responses/404'
        default:
          description: Unexpected error.
  /lifecycle/{name}/validate:
    parameters:
      - $ref: '#/components/parameters/name'
    post:
      description: Check a lifecycle configuration without saving it. Answers
