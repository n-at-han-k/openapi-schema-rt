          description: Unexpected error.
  /ticket/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      description: Get information about a ticket.
      operationId: ticket_id_get
      tags:
        - Ticket
      responses:
        "200":
          description: Ticket fetched successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/objectMetadata'
                  - $ref: '#/components/schemas/customFields'
                  - type: object
                    properties:
                      Queue:
                        $ref: '#/components/schemas/queueReference'
                      Owner:
                        $ref: '#/components/schemas/userReference'
                      Starts:
                        $ref: '#/components/schemas/maybeDateTime'
                      Started:
                        type: string
                        format: date-time
                      EffectiveId:
                        $ref: '#/components/schemas/ticketReference'
                      Resolved:
                        $ref: '#/components/schemas/maybeDateTime'
                      Due:
                        $ref: '#/components/schemas/maybeDateTime'
                      Subject:
                        type: string
                      TimeEstimated:
                        type: string
                        example: "0"
                      TimeWorked:
                        type: string
                        example: "0"
                      TimeLeft:
                        type: string
                        example: "0"
                      InitialPriority:
                        type: string
                        example: "0"
                      Priority:
                        $ref: '#/components/schemas/ticketPriority'
                      FinalPriority:
                        type: string
                        example: "0"
                      Requestor:
                        type: array
                        items:
                          $ref: '#/components/schemas/userReference'
                      Cc:
                        type: array
                        description: probably userReferences
                      AdminCc:
                        type: array
                        description: probably userReferences
                      Type:
                        $ref: '#/components/schemas/constantTicket'
                      Status:
                        $ref: '#/components/schemas/ticketStatus'
                      _hyperlinks:
                        type: array
                        description: Things and operations related to this ticket.
                          Probably contains multiple lifecycle operations.
                        items:
                          anyOf:
                            - $ref: '#/components/schemas/hyperlinkComment'
                            - $ref: '#/components/schemas/hyperlinkCorrespond'
                            - $ref: '#/components/schemas/hyperlinkCustomField'
                            - $ref: '#/components/schemas/hyperlinkHistory'
                            - $ref: '#/components/schemas/hyperlinkSelf'
                            - $ref: '#/components/schemas/hyperlinkLifecycle'
                    required:
                      - Queue
                      - Owner
                      - Starts
                      - Started
                      - EffectiveId
                      - Resolved
                      - Due
                      - Subject
                      - TimeEstimated
                      - TimeWorked
                      - TimeLeft
                      - InitialPriority
                      - Priority
                      - FinalPriority
                      - Requestor
                      - Cc
                      - AdminCc
                      - Type
                      - Status
                      - _hyperlinks
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
        default:
          description: Unexpected error.
    put:
      description: Update a ticket.
      operationId: ticket_id_put
      tags:
        - Ticket
      requestBody:
        description: Might not be exhaustive.
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/customFieldsUpload'
                - $ref: '#/components/schemas/ticketLinksUpload'
                - $ref: '#/components/schemas/ticketPropertiesUploadCommon'
                - type: object
                  description: Properties specific to updating a ticket
                  properties:
                    Queue:
                      type: string
                      description: Name of the queue where the ticket ought to be created/moved.
                      example: General
      responses:
        "200":
          description: This is returned pretty much always. You need to inspect the content to figure out what happened.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                success:
                  description: Trying to set two properties to user TargetUser, but lacking privileges.
                  value:
                    - customfield 1 changed to 0
                nothingDone:
                  description: Providing nonsense keys will just result in a nop.
                    Though it shouldnt be possile if you stick to this spec.
                  value: []
                cyclicLinkError:
                  description: Tried to make a cyclic ticket link
                  value:
                    - Refused to add link which would create a circular relationship
                queueMoveToNonExisting:
                  description: Tried to change queue to a non-existing queue
                  value:
                    - "Ticket 199: Queue NewQueue does not exist"
        "404":
          $ref: '#/components/responses/404'
        default:
          description: Unexpected error.
    delete:
      description: Delete a ticket, which sets its status to deleted rather than removing anything. What RT calls a shredder is not in this API.
