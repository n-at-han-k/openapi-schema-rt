                        # though it is plainly a number. RT does this with
                        # most of its integers.
                        anyOf:
                          - type: integer
                          - type: string
                      URI:
                        type: string
                      Disabled:
                        $ref: '#/components/schemas/perlBoolean'
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
        default:
