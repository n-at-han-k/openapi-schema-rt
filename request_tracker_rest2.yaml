openapi: "3.1.0"
info:
  title: Request Tracker REST2
  description: Partial specification of Request Tracker's REST2 API.
  version: "0.2.1"
  contact:
    name: Iisakki Jaakkola
    email: iihaja@utu.fi
externalDocs:
  url: https://docs.bestpractical.com/rt/latest/RT/REST2.html
  description: Official documentation
servers:
  - url: /REST/2.0
security:
  - token: []
  - basicAuth: []
tags:
  - name: Miscellaneous
  - name: Queue
  - name: Ticket
  - name: User
  - name: User Memberships
  - name: Group
  - name: Group Memberships
  - name: Custom Field
components:
  securitySchemes:
    token:
      type: apiKey
      name: Authorization
      in: header
      description: The apikey has to be prefixed with "token ".
    basicAuth:
      type: http
      scheme: Basic
      description: Prefer token authentication over this.
  requestBodies:
    jsonSearch:
      description: The search terms.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/jsonSearch'
  responses:
    "204":
      description: Success, no content.
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/justMessage'
          example:
            message: Queue name is required
    "401":
      description: Authrotization failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/justMessage'
          example:
            message: Unauthorized
    "403":
      description: No permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/justMessage'
          example:
            message: No permission to create tickets in the queue 'myqueue'
    "404":
      description: The resource wasnt found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/justMessage'
          example:
            message: Not Found
    # It's pretty much impossible to get this if one follows this spec,
    # but anyway it is in the server's repertuare.
    # "415":
    #  description: Unsupported Media Type
    #   content:
    #     application/json:
    #       schema:
    #         $ref: '#/components/schemas/justMessage'
    #       example:
    #         message: Unsupported Media Type
    "doubleDeletion":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/justMessage'
          example:
            message: Internal Server Error
  schemas:
    # Schemas that can be used as such
    justMessage:
      description: Just a message. This is often used in errors.
      type: object
      properties:
        message:
          type: string
      required:
        - message
    objectMetadata:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/id'
        Created:
          type: string
          format: date-time
        Creator:
          $ref: '#/components/schemas/userReference'
        LastUpdated:
          type: string
          format: date-time
        LastUpdatedBy:
          $ref: '#/components/schemas/userReference'
      required:
        - id
        - Created
        - Creator
        - LastUpdated
        - LastUpdatedBy
    customFields:
      type: object
      description: An object with customfields in a response
      properties:
        CustomFields:
          $ref: '#/components/schemas/customFieldsArray'
      required:
        - CustomFields
    customFieldsUpload:
      type: object
      description: An object with customfields in request body
      properties:
        CustomFields:
          description: Structure for uploading custom field values in POSTs and PUTs.
          type: object
          # Basically just a map of custom field key-value pairs.
          additionalProperties:
            anyOf:
              - type:
                  - string
                  - "null"
                description: Single valued custom fields. Use null to remove a value.
              - type: array
                description: Multi-valued custom fields. Use an empty array to clear values.
                items:
                  type: string
          example:
            OperatingSystem: Linux
            SemethingToClear: null
            YourFavoriteNumbers:
              - "1"
              - "6"
              - "pi"
    customFieldCommon:
      description: Fields shared by operations targeted at the customfields themselves
      type: object
      properties:
        Name:
          type: string
        Type:
          type: string
          description: Custom field type.
          # Multiple/single instances are the same.
          # E.g. upload singe and multiple image CF types both show up as "Image" here.
          enum:
            - HTML
            - Freeform
            - Select
            # "Fill in one text area"
            - Text
            - Image
            - Binary # File
            - Combobox
            - Autocomplete
            - Date
            - DateTime
            - IPAddress
            - IPAddressRange
            # Added by the popular BooleanCustomField extension.
            # https://metacpan.org/pod/RT::Extension::BooleanCustomField
            - Boolean
        RenderType:
          type: string
          description: How the custom field is displayed in the UI.
          enum:
            # Most types of CFs don't have any options.
            - ""
            - Select box
            - List
            - Checkbox
        LookupType:
          description: What type of object this custom field applies to?
          type: string
          enum:
            - "" # This seems to be an errorous state in RT but it can nonetheless happen.
            - RT::Catalog-RT::Asset
            - RT::Class
            - RT::Class-RT::Article
            - RT::Group
            - RT::Queue
            - RT::Queue-RT::Ticket
            - RT::Queue-RT::Ticket-RT::Transaction
            - RT::User
        ValidationHint:
          type: string
      required:
        - Name
        - Type
        # RenderType doesn't always appear.
        - LookupType
    paginated:
      description: Response properties for paginated endpoints. items array of the correct type has to be added still.
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        pages:
          type: integer
          minimum: 0
        per_page:
          type: integer
          minimum: 1
        count:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
      required:
        - page
        - pages
        - per_page
        - count
        - total
    userPropertiesCommon:
      description: Properties shared with multiple user related operations. Does not include required status.
      type: object
      properties:
        RealName:
          type: string
        NickName:
          type: string
        EmailAddress:
          type: string
          anyOf:
            # An email address or an empty string
            - format: email
            - maxLength: 0
        Gecos:
          type: string
          description: '"Unix login" in the UI'
        Lang:
          type: string
          example: fi
        Timezone:
          type: string
          example: Africa/Ceuta
        FreeformContactInfo:
          type: string
          description: '"Extra info" in the UI'
        Comments:
          type: string
          description: Comments about the user.
        WorkPhone:
          type: string
        MobilePhone:
          type: string
        HomePhone:
          type: string
        PagerPhone:
          type: string
        Organization:
          type: string
        Address1:
          type: string
        Address2:
          type: string
        City:
          type: string
        Zip:
          type: string
        State:
          type: string
        Country:
          type: string
    userPassword:
      type: object
      description: Optionanl password property for a user object
      properties:
        Password:
          type: string
          description: Use a strong password!
    ticketPropertiesUploadCommon:
      description: Properties shared with ticket creation and update operations.
      type: object
      properties:
        Subject:
          type: string
          description: Corresponds to the email subject if creating ticket via email
          example: Pls halp
        Owner:
          type: string
          description: Name of the owner
          example: root
        Requestor:
          type: string
          description: Name of the requestor.
            It will not default to the account you are using to make the API call.
          example: root
        Cc:
          type: string
          description: Name of the CC
          example: root
        AdminCc:
          type: string
          description: Name of the adminCC
          example: root
        Starts:
          $ref: '#/components/schemas/maybeDateTime'
        Due:
          $ref: '#/components/schemas/maybeDateTime'
        Priority:
          $ref: '#/components/schemas/ticketPriority'
        Status:
          $ref: '#/components/schemas/ticketStatus'
    ticketPriority:
      type: string
      description: Ticket priority as an integer from 0 (low) to 100 (high)
      example: "50"
    ticketStatus:
      type: string
      description: The values of this field depend on the lifecycle in use.
      example: open
    ticketLinksUpload:
      type: object
      description: Ticket links when creating or updating a ticket.
      properties:
        DependsOn:
          $ref: '#/components/schemas/ticketLink'
        Child:
          $ref: '#/components/schemas/ticketLink'
        ReferredToBy:
          $ref: '#/components/schemas/ticketLink'
        Parent:
          $ref: '#/components/schemas/ticketLink'
        DependedOnBy:
          $ref: '#/components/schemas/ticketLink'
        RefersTo:
          $ref: '#/components/schemas/ticketLink'
      example:
        DependsOn: 1
        Child: 2
        ReferredToBy: 3
        Parent: 4
        DependedOnBy: 5
        RefersTo: 6
    jsonSearch:
      description: Searching with JSON format. Generally used on things other than tickets.
      schema:
        type: array
        items:
          description: One search term
          type: object
          properties:
            field:
              type: string
              examples:
                - Name
                - id
            operator:
              description: The comparison operator to use. Enum may be incomplete.
              type: string
              enum:
                - LIKE
                - "="
                - "<"
                - ">"
            value:
              type: string
            entry_aggregator:
              type: string
              description: How to combine search terms. OR by default.
              enum:
                - OR
                - AND
          required:
            - field
            - value
          additionalProperties: false
    # Incomplete schemas (to be used as building blocks)
    genericObject:
      description: A generic object thats used in many API endpoints. Refer this within suitable schemas.
        Note that there are strictly typed versions of this too.
      type: object
      allOf:
        - $ref: '#/components/schemas/typelessGenericObject'
        - $ref: '#/components/schemas/objectType'
    queueReference:
      description: A reference to a queue.
      type: object
      allOf:
        - $ref: '#/components/schemas/typelessGenericObject'
        - type: object
          description: Always a queue
          properties:
            type:
              type: string
              enum:
                - queue
          required:
            - type
    userReference:
      description: A reference to a user.
      type: object
      allOf:
        - $ref: '#/components/schemas/typelessGenericObject'
        - type: object
          description: Always a user
          properties:
            type:
              type: string
              enum:
                - user
          required:
            - type
    groupReference:
      description: A reference to a group.
      type: object
      allOf:
        - $ref: '#/components/schemas/typelessGenericObject'
        - type: object
          description: Always a group.
          properties:
            type:
              $ref: '#/components/schemas/constantGroup'
          required:
            - type
    ticketReference:
      description: A reference to a ticket
      type: object
      allOf:
        - $ref: '#/components/schemas/typelessGenericObject'
        - type: object
          description: Always a ticket
          properties:
            type:
              $ref: '#/components/schemas/constantTicket'
          required:
            - type
    customFieldReference:
      description: A reference to a custom field
      type: object
      allOf:
        - $ref: '#/components/schemas/typelessGenericObject'
        - type: object
          description: Always a custom field
          properties:
            type:
              $ref: '#/components/schemas/constantCustomField'
          required:
            - type
    typelessGenericObject:
      description: A generic object with type field missing. Add it in other templates.
      type: object
      properties:
        _url:
          type: string
          format: uri
          description: URL of the objects api endpoint.
        id:
          type: string
          description: This sounds like an int but actually its quite often a string.
          examples:
            - RT_System
            - root
      required:
        - id
        - _url
    # "_hyperlink" related polymorphic objects
    hyperlink:
      description: Parent object for _hyperlink objects
      type: object
      properties:
        ref:
          type: string
          description: Discriminates between hyperlink object types
        _url:
          description: The URL for evoking the offered operation.
          allOf:
            - $ref: '#/components/schemas/url'
      required:
        - ref
        - _url
      discriminator:
        propertyName: ref
        mapping:
          # All derivations should be declared here.
          comment: '#/components/schemas/hyperlinkComment'
          correspond: '#/components/schemas/hyperlinkCorrespond'
          create: '#/components/schemas/hyperlinkCreate'
          customfield: '#/components/schemas/hyperlinkCustomField'
          customfieldvalues: '#/components/schemas/hyperlinkCustomFieldValues'
          history: '#/components/schemas/hyperlinkHistory'
          lifecycle: '#/components/schemas/hyperlinkLifecycle'
          members: '#/components/schemas/hyperlinkMembers'
          memberships: '#/components/schemas/hyperlinkMemberships'
          self: '#/components/schemas/hyperlinkSelf'
          # Ticket links are all of the same type
          depends-on: '#/components/schemas/hyperlinkTicketLink'
          child: '#/components/schemas/hyperlinkTicketLink'
          referred-to-by: '#/components/schemas/hyperlinkTicketLink'
          parent: '#/components/schemas/hyperlinkTicketLink'
          depended-on-by: '#/components/schemas/hyperlinkTicketLink'
          refers-to: '#/components/schemas/hyperlinkTicketLink'
    hyperlinkComment:
      description: Link for commenting, somehow.
      allOf:
        - $ref: '#/components/schemas/hyperlink'
    hyperlinkCorrespond:
      description: Link for corresponding, somehow.
      allOf:
        - $ref: '#/components/schemas/hyperlink'
    hyperlinkCreate:
      description: Operation to create a ticket
      allOf:
        - $ref: '#/components/schemas/hyperlink'
        - type: object
          properties:
            type:
              $ref: '#/components/schemas/constantTicket'
          required:
            - type
    hyperlinkCustomField:
      description: Reference to a custom field, as in the object itself, and not any particular value.
      allOf:
        - $ref: '#/components/schemas/hyperlink'
        - type: object
          properties:
            id:
              type: string
              example: "3"
            name:
              type: string
            type:
              $ref: '#/components/schemas/constantCustomField'
          required:
            - id
            - type
            - name
    hyperlinkCustomFieldValues:
      description: Reference to available customfield values of select type CFs.
      allOf:
        - $ref: '#/components/schemas/hyperlink'
    hyperlinkHistory:
      description: Link to element history
      allOf:
        - $ref: '#/components/schemas/hyperlink'
    hyperlinkLifecycle:
      description: A possible transition in the objects state.
      allOf:
        - $ref: '#/components/schemas/hyperlink'
        - type: object
          properties:
            from:
              type: string
              example: open
              description: Current lifecycle status
            to:
              type: string
              description: Target status of this transition
              example: resolved
            update:
              type: string
              description: Apparently this means the way that the transition would be carried out?
              examples:
                - Comment
                - Respond
            label:
              type: string
              description: Seems to be more of a human readable name for the transaction thats being described.
              examples:
                - Resolve
                - Reject
                - Stall
          required:
            - from
            - to
            - update
            - label
    hyperlinkMembers:
      description: Show group members.
      allOf:
        - $ref: '#/components/schemas/hyperlink'
    hyperlinkMemberships:
      description: Show groups whose member this user/group is.
      allOf:
        - $ref: '#/components/schemas/hyperlink'
    hyperlinkSelf:
      description: Link to self. Type will vary depending on where you got this from.
      allOf:
        - $ref: '#/components/schemas/hyperlink'
        - type: object
          properties:
            id:
              type: string
              example: "3"
            type:
              $ref: '#/components/schemas/typeEnum'
          required:
            - id
            - type
    hyperlinkTicketLink:
      description: A link to another ticket
      allOf:
        - $ref: '#/components/schemas/hyperlink'
        - type: object
          properties:
            id:
              type: string
              example: "3"
            type:
              $ref: '#/components/schemas/constantTicket'
          required:
            - id
            - type
    # Fields
    customFieldsArray:
      type: array
      description: Customfields with their values, as returned by the server.
      items:
        type: object
        properties:
          id:
            type: string
            example: "6"
          name:
            type: string
            description: Key
          values:
            type: array
            description: TODO
          _url:
            $ref: '#/components/schemas/url'
          type:
            type: string
            enum:
              - customfield
        required:
          - id
          - name
          - values
          - _url
          - type
        additionalProperties: false
    id:
      description: Integer identifier
      type: integer
      minimum: 1
    objectType:
      description: Object containing type field.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/typeEnum'
      required:
        - type
    typeEnum:
      description: Enum used in many type named fields.
      type: string
      enum:
        # Likely not complete
        - queue
        - ticket
        - user
    maybeDateTime:
      descrtiption: A date-time string which may be undefined. Which RT expresses as unix timestamp zero.
        I.e. the start of 1970. So you probably want to compare these values to it.
        It appears like only UTC times are supported.
        So returned times are always in UTC and uploading times with a timezone component other than Z will fail silently.
      type: string
      format: date-time
      example: 1970-01-01T00:00:00Z
    perlBooleanInteger:
      description: Same as perlBoolean but in the slightly more sensible integer format.
      type: integer
      enum:
        # true
        - 1
        # false
        - 0
    perlBoolean:
      description: RT doesn't bother to translate perl boolean value to JSON.
      type: string
      enum:
        # true
        - "1"
        # false
        - "0"
    sortOrder:
      type: string
      description: Seems to be an enumeration of some kind.
      example: "0"
    url:
      description: An URL pointing somewhere in the web
      type: string
      format: uri
      example: "https://localhost/REST/2.0/customfield/6"
    ticketLink:
      # A link to another ticket when uploading.
      anyOf:
        - type: integer
          description: ID of a ticket
          example: 1
        - type: array
          description: IDs of tickets
          items:
            type: integer
          example:
            - 10
            - 15
        - type: string
          description: A freeform string. E.g. this could be a URL to another system.
    # Constants
    constantCustomField:
      description: Always customfield
      type: string
      enum:
        - customfield
    constantGroup:
      description: Always group
      type: string
      enum:
        - group
    constantTicket:
      description: Always ticket
      type: string
      enum:
        - ticket
  parameters:
    id:
      name: id
      in: path
      required: true
      description: The id of the object we are interested in
      schema:
        type: integer
        minimum: 1
    idOrName:
      name: idOrName
      in: path
      required: true
      description: Name or id of the resource.
      schema:
        oneOf:
          - type: integer
            minimum: 1
            description: Id of the resource
          - type: string
            description: Name of the resource
    query:
      name: query
      in: query
      description: RT query string (or a simple search string in some cases)
      schema:
        type: string
      allowReserved: true
  links:
    creator:
      description: Who created this thing in my RT?!
      operationId: user_id_name_get
      parameters:
        idOrName: $response.body#/Creator/id
    lastUpdatedBy:
      description: Who ruined it this time..?
      operationId: user_id_name_get
      parameters:
        idOrName: $response.body#/LastUpdatedBy/id
paths:
  /rt:
    get:
      description: Produces system information.
      operationId: rt_get
      tags:
        - Miscellaneous
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  Version:
                    type: string
                  Plugins:
                    type: array
                    description: This list will only be present if the user has SuperUser privileges in RT.
                    items:
                      description: Perl module names.
                      type: string
                      example: 'RT::Extension::GroupSummary'
                required:
                  - Version
                example:
                  Version: "5.0.3"
                  Plugins:
                    - "RT::Extension::Announce"
                    - "RT::Extension::GroupSummary"
        "401":
          $ref: '#/components/responses/401'
        default:
          description: Unexpected error.
  /users:
    # There's also a get version of this, but it takes arguments in query so it's a mess.
    # JSON content version is much nicer.
    post:
      operationId: users_get
      description: Search for users
      tags:
        - User
      requestBody:
        description: Search terms
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/jsonSearch'
            examples:
              usersByName:
                description: Searching for a user by name
                value:
                  - field: Name
                    value: userid
                    operator: LIKE
      responses:
        "200":
          description: Search successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/paginated'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/userReference'
                    required:
                      - items
        "401":
          $ref: '#/components/responses/401'
        default:
          description: Unexpected error.
  /user:
    post:
      description: Create a new user.
      operationId: user_post
      tags:
        - User
      requestBody:
        description: Details for the upcoming user.
          Note that users are created unprivileged by default.
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/customFieldsUpload'
                - $ref: '#/components/schemas/userPropertiesCommon'
                - $ref: '#/components/schemas/userPassword'
                - type: object
                  description: Properties not in userPropertiesCommon.
                  properties:
                    Name:
                      type: string
                    Disabled:
                      $ref: '#/components/schemas/perlBoolean'
                    Privileged:
                      description: Can this user be granted rights in RT?
                      allOf:
                        - $ref: '#/components/schemas/perlBooleanInteger'
                  required:
                    - Name
            example:
              Name: NewUser
              Privileged: 1
              Password: Color Out of Space is an intriguing story by Lovecraft.
      responses:
        "201":
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userReference'
          links:
            disable:
              description: Oops a mistake, let's disable the new user!
              operationId: user_id_name_delete
              parameters:
                idOrName: $response.body#/id
            get:
              description: Remind me of what I just entered, will you?
              operationId: user_id_name_get
              parameters:
                idOrName: $response.body#/id
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/justMessage'
              examples:
                nameTake:
                  description: Account with this name already exists.
                  value:
                    message: "Name in use"
        "401":
          $ref: '#/components/responses/401'
        default:
          description: Unexpected error.
  /user/{idOrName}:
    parameters:
      - $ref: '#/components/parameters/idOrName'
    get:
      description: Get information about a user.
      operationId: user_id_name_get
      tags:
        - User
      responses:
        "200":
          description: Successfully fetched user info.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/customFields'
                  - $ref: '#/components/schemas/objectMetadata'
                  - $ref: '#/components/schemas/userPropertiesCommon'
                  - type: object
                    description: Requirements not in userPropertiesCommon. System accounts will have quite a bit less fields.
                    properties:
                      Name:
                        type: string
                      Disabled:
                        $ref: '#/components/schemas/perlBoolean'
                      Privileged:
                        description: Can this user be granted rights in RT?
                        allOf:
                          - $ref: '#/components/schemas/perlBooleanInteger'
                    required:
                      - Name
                      - Disabled
                      - Privileged
                  - type: object
                    properties:
                      Memberships:
                        type: array
                        items:
                          $ref: '#/components/schemas/groupReference'
                      _hyperlinks:
                        type: array
                        items:
                          anyOf:
                            - $ref: '#/components/schemas/hyperlinkSelf'
                            - $ref: '#/components/schemas/hyperlinkHistory'
                            - $ref: '#/components/schemas/hyperlinkMemberships'
                        example:
                          - id: 41
                            ref: self
                            _url: https://localhost/REST/2.0/user/41
                            type: user

                          - _url: https://localhost/REST/2.0/user/41/history
                            ref: history

                          - ref: memberships
                            _url: https://localhost/REST/2.0/user/41/groups
                    required:
                      - Memberships
                      - _hyperlinks
          links:
            disable:
              description: Disable the user.
              operationId: user_id_name_delete
              parameters:
                idOrName: $request.path.idOrName
            creator:
              $ref: '#/components/links/creator'
            lastUpdatedBy:
              $ref: '#/components/links/lastUpdatedBy'
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
        default:
          description: Unexpected error.
    put:
      description: Update a user. Password cannot be changed.
      operationId: user_id_name_put
      tags:
        - User
      requestBody:
        description: The canges to be made to the user
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/customFieldsUpload'
                - $ref: '#/components/schemas/userPropertiesCommon'
                - type: object
                  description: Properties not in userPropertiesCommon
                  # Shouldn't be empty.
                  minProperties: 1
                  properties:
                    Name:
                      type: string
                    Disabled:
                      $ref: '#/components/schemas/perlBoolean'
                    Privileged:
                      description: Can this user be granted rights in RT?
                      allOf:
                        - $ref: '#/components/schemas/perlBooleanInteger'
      responses:
        "200":
          description: This is returned pretty much always. You need to inspect the content to figure out what happened.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                success:
                  description: Trying to set two properties to user TargetUser, but lacking privileges.
                  value:
                    - "User TargetUser: City changed from (no value) to 'Turku'"
                    - "User TargetUser: NickName changed from (no value) to 'Nick'"
                successfullyMadePrivileged:
                  description: Response for just making a user privileged.
                  value:
                    - "That user is now privileged"
                permissionDenied:
                  description: Trying to set two properties to user TargetUser, but lacking privileges.
                  value:
                    - "User TargetUser: Permission Denied"
                    - "User TargetUser: Permission Denied"
                nothingDone:
                  description: Providing nonsense keys will just result in a nop.
                    Though it shouldnt be possile if you stick to this spec.
                  value: []
        "404":
          $ref: '#/components/responses/404'
        default:
          description: Unexpected error.
    delete:
      description: Disable a user. Doesn't actually delete anything.
      operationId: user_id_name_delete
      tags:
        - User
      responses:
        "204":
          $ref: '#/components/responses/204'
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
        "500":
          # This is thrown if you try to delete an already deleted user.
          $ref: '#/components/responses/doubleDeletion'
        default:
          description: Unexpected error.
