                          $ref: '#/components/schemas/userReference'
                      Contact:
                        type: array
                        items:
                          $ref: '#/components/schemas/userReference'
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
        default:
          description: Unexpected error.
    put:
      description: Update an asset. This is ALSO how an asset is deleted, by
        setting Status to "deleted" -- there is no DELETE for an asset, and RT
        answers 500 to one.
      operationId: asset_id_put
      tags:
        - Asset
      requestBody:
        required: true
