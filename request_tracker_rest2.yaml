                    Description:
                      type: string
                    EntryHint:
                      type: string
                    MaxValues:
                      type: string
                      enum:
                        - "1"
                        - "0"
                    UniqueValues:
                      $ref: '#/components/schemas/perlBoolean'
                    Pattern:
                      type: string
                    SortOrder:
                      $ref: '#/components/schemas/sortOrder'
                    Disabled:
                      $ref: '#/components/schemas/perlBoolean'
      responses:
        "200":
          description: This is returned pretty much always. You need to inspect
