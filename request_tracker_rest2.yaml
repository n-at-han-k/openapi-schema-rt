                - $ref: '#/components/schemas/assetPropertiesCommon'
      responses:
        "200":
          description: This is returned pretty much always. You need to inspect
            the content to figure out what happened.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "404":
          $ref: '#/components/responses/404'
        default:
          description: Unexpected error.
