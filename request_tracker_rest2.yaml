        description: The object to stop applying the field to, or 0 for the
          global application.
        schema:
          type: integer
          minimum: 0
    delete:
      description: Stop applying this custom field to one object.
      operationId: customfield_id_appliesto_object_delete
      tags:
        - Custom Field
      responses:
        "204":
          $ref: '#/components/responses/204'
        "400":
