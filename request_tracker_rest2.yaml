      tags:
        - Ticket
      responses:
        "204":
          $ref: '#/components/responses/204'
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
        "500":
          $ref: '#/components/responses/doubleDeletion'
        default:
          description: Unexpected error.
