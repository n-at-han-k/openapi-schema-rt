        lookup type.
      operationId: customfield_id_appliesto_get
      tags:
        - Custom Field
      responses:
        "200":
          description: Applications queried successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/paginated'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/customFieldApplication'
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
        default:
          description: Unexpected error.
    post:
      description: Apply this custom field to an object -- a queue for a ticket
        field, a catalog for an asset field, a class for an article field.
        ObjectId 0 applies it globally.
      operationId: customfield_id_appliesto_post
      tags:
        - Custom Field
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ObjectId:
                  description: The id of the object to apply it to, or 0 for
                    every object of its lookup type.
                  type: integer
                  minimum: 0
              required:
                - ObjectId
            example:
              ObjectId: 1
      responses:
        "201":
          description: Applied successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  ObjectId:
                    type: integer
                  ObjectType:
                    type: string
                  ObjectName:
                    type: string
          links:
            unapply:
              description: Stop applying the field to the object it was just
                applied to. The path carries the object, so nothing can derive
                it from this response alone.
              operationId: customfield_id_appliesto_object_delete
              parameters:
                id: $request.path.id
                objectId: $request.body#/ObjectId
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
        default:
          description: Unexpected error.
  /customfield/{id}/appliesto/object/{objectId}:
