  /lifecycles:
    get:
      description: Retrieve a list of the lifecycles configured on this RT.
      operationId: lifecycles_get
      tags:
        - Lifecycle
      parameters:
        - name: type
          in: query
          description: Limit the list to lifecycles of one kind.
          schema:
            type: string
            enum:
              - ticket
              - asset
      responses:
        "200":
          description: Lifecycles queried successfully.
          content:
            application/json:
              schema:
                # A bare ARRAY, not a paginated envelope: lifecycles are
                # configuration rather than records, and RT hands back every
                # one of them with its whole configuration inline.
                type: array
                items:
                  $ref: '#/components/schemas/lifecycleDocument'
        "401":
          $ref: '#/components/responses/401'
        default:
          description: Unexpected error.
    post:
      description: Create a new lifecycle. Note that unlike every other object
        in this API, a lifecycle is created on its PLURAL path -- there is no
        POST /lifecycle -- and is addressed by name thereafter.
      operationId: lifecycles_post
      tags:
        - Lifecycle
      requestBody:
        description: The new lifecycle. Only the name and the type are given
          here; the statuses and transitions are configured with a subsequent
          PUT, which is how the web UI does it too.
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                Name:
                  type: string
                  # RT answers 400 "Lifecycle Name has a maximum length of 32
                  # characters" -- the only length limit in this API that is
                  # enforced rather than documented.
                  maxLength: 32
                  example: support
                Type:
                  type: string
                  enum:
                    - ticket
                    - asset
              required:
                - Name
                - Type
      responses:
        "201":
          description: Lifecycle created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lifecycleDocument'
          links:
            get:
              description: Get the lifecycle you just created.
              operationId: lifecycle_name_get
              parameters:
                name: $response.body#/id
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        default:
          description: Unexpected error.
  /lifecycle/{name}:
    parameters:
      - $ref: '#/components/parameters/name'
    get:
      description: Get a lifecycle's configuration.
      operationId: lifecycle_name_get
      tags:
        - Lifecycle
      responses:
        "200":
          description: Lifecycle queried successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lifecycleDocument'
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
        default:
          description: Unexpected error.
    put:
      description: Replace a lifecycle's configuration. This is the whole
        document, not a patch -- a key left out is a key removed.
      operationId: lifecycle_name_put
      tags:
        - Lifecycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/lifecycleConfiguration'
      responses:
        "200":
          description: Lifecycle updated.
          content:
            application/json:
              schema:
                # The lifecycle as it now stands, not a list of what changed.
                # Unlike every other PUT in this API.
                $ref: '#/components/schemas/lifecycleDocument'
        "400":
          $ref: '#/components/responses/400'
        "404":
          $ref: '#/components/responses/404'
        default:
          description: Unexpected error.
    delete:
      description: Delete a lifecycle. Fails if anything still uses it.
      operationId: lifecycle_name_delete
      tags:
        - Lifecycle
      responses:
        "204":
          $ref: '#/components/responses/204'
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
        default:
          description: Unexpected error.
